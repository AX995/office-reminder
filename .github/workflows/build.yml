name: 打包 Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install pyside6 pyinstaller

      - name: 打包 EXE
        run: |
          pyinstaller --onefile --windowed --name "办公助手" main.py

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: 办公助手-Windows
          path: dist/办公助手.exe
